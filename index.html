<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>四上人文問答大挑戰</title><link rel="stylesheet" href="style.css"></head><body>
<main id="app"><section id="home" class="card"><div class="logo">🌏</div><h1>四上人文問答大挑戰</h1><p class="sub">香港 · 地球 · 第1–4課</p>
<button class="big mode" data-l="0">🌐 全冊混合（20題）</button><div class="grid"><button class="big mode" data-l="1">第1課</button><button class="big mode" data-l="2">第2課</button><button class="big mode" data-l="3">第3課</button><button class="big mode" data-l="4">第4課</button></div></section>
<section id="quiz" class="card hide"><div class="top"><span id="prog"></span><span id="score"></span></div><div class="bar"><div id="fill"></div></div><p id="tag" class="tag"></p><h2 id="q"></h2><div id="opts"></div><div id="fb" class="hide"></div><button id="next" class="big next hide">下一題 ➜</button></section>
<section id="result" class="card hide"><h1>挑戰完成！</h1><div id="stars"></div><p id="final"></p><div id="per"></div><button id="again" class="big">🔁 再玩一次</button><button id="home2" class="big alt">🏠 返回首頁</button></section></main><script src="app.js"></script></body></html>
